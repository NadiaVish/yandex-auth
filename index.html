<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход выполнен!</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 80px; background: #f4f7f9; }
        .btn { background: #d88dc9; color: white; padding: 18px 30px; border: none; border-radius: 12px; font-size: 18px; cursor: pointer; font-weight: bold; width: 300px; margin-top: 20px; }
        .message { 
            background: #a8ccd5; 
            color: white; 
            padding: 20px; 
            border-radius: 12px; 
            max-width: 400px; 
            margin: 20px auto;
            display: none;
        }
        .message p { margin: 0; font-size: 18px; }
        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d88dc9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="initialView">
        <h2>✅ Почти готово</h2>
        <p>Нажмите кнопку, чтобы подтвердить авторизацию.</p>
        <button id="confirmBtn" class="btn" onclick="handleWindows()">ПОДТВЕРДИТЬ ВХОД</button>
    </div>
    
    <div id="messageView" class="message">
        <p>✅ После подтверждения переадресации можно закрыть эту страницу и вернуться в приложение.</p>
    </div>
    
    <div id="spinner" class="spinner"></div>

    <script>
        const hash = window.location.hash;

        function handleWindows() {
            document.getElementById('initialView').style.display = 'none';
            document.getElementById('spinner').style.display = 'block';
            
            if (!hash) return;

            const appUrl = "todoapp://oauth" + hash;
            const iframe = document.createElement("iframe");
            iframe.style.display = "none";
            iframe.src = appUrl;
            document.body.appendChild(iframe);
            
            setTimeout(() => {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('messageView').style.display = 'block';
            }, 500);
        }
    </script>
</body>
</html>
